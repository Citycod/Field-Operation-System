version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: field_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus_dev_password}
      POSTGRES_DB: ${DB_DATABASE:-field_platform}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus} -d ${DB_DATABASE:-field_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11.1.2
    container_name: field_platform_directus
    restart: unless-stopped
    ports:
      - "${PORT:-8055}:8055"
    environment:
      SECRET: "${SECRET:-change-this-secret-in-production-min-32-chars}"
      KEY: "${KEY:-change-this-key-in-production-min-32-chars}"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-field_platform}"
      DB_USER: "${DB_USER:-directus}"
      DB_PASSWORD: "${DB_PASSWORD:-directus_dev_password}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@fieldplatform.internal}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-AdminPassword123!}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8055}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
